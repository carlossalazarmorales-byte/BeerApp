name: beerapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  # Already pulled in transitively by supabase_flutter; made direct because
  # ApiClient (core/network/) now calls it directly to talk to the FastAPI
  # backend -- see docs/DECISIONS.md. No dio: nothing here needs interceptor
  # chains/retries beyond what's hand-rolled, and http already ships
  # package:http/testing.dart's MockClient, covering the test story with no
  # extra dependency.
  http: ^1.5.0
  # Already pulled in transitively by supabase_flutter (its automatic deep
  # link detection uses it internally) -- made direct because we now also
  # call it ourselves (see core/auth/auth_deep_link_handler.dart), and a
  # transitive dependency can be dropped or changed without notice.
  app_links: ^7.2.1
  maplibre_gl: ^0.27.1
  fl_chart: ^1.2.0
  # Barcode scanning for Phase 11 (Scanner). CameraX/ML Kit on Android,
  # AVFoundation/Vision on iOS -- no cloud service, no account, no API key.
  # Camera permission is requested/owned entirely by this package
  # (MobileScannerController.value.hasCameraPermission, the
  # permissionDenied error code); no permission_handler dependency is
  # added on top of it. Version pinned deliberately after reviewing its
  # source/changelog against this project's Flutter/Dart SDK -- see
  # docs/DECISIONS.md.
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 400

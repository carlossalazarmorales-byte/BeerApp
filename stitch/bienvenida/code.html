</div>
</div>
</div>
<h1 class="font-headline font-black text-4xl uppercase tracking-widest text-white mb-2 text-glow">

<p class="font-headline font-semibold text-primary-fixed tracking-tight text-lg">

</button>

<span class="material-symbols-outlined text-2xl" data-icon="facebook">social_leaderboard</span>
<span>Continuar con Facebook</span>
</button>
</div>

<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
